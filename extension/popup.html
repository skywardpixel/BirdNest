<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    width: 260px; margin: 0; padding: 12px;
    font: 13px/1.4 system-ui, -apple-system, sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { font-size: 13px; margin: 0 0 2px; }
  .sub { opacity: .65; font-size: 12px; margin-bottom: 10px;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    margin: 0 0 6px; padding: 8px 10px; text-align: left;
    font: inherit; color: inherit; cursor: pointer;
    background: color-mix(in srgb, CanvasText 8%, Canvas);
    border: 1px solid color-mix(in srgb, CanvasText 15%, Canvas);
    border-radius: 8px;
  }
  button:hover:not(:disabled) { background: color-mix(in srgb, CanvasText 15%, Canvas); }
  button:disabled { opacity: .4; cursor: default; }
  .glyph { font-size: 15px; width: 18px; text-align: center; }
  #status { margin-top: 8px; font-size: 12px; min-height: 1.4em; opacity: .8; }
  .err { color: #e0245e; }
  .ok { color: #17bf63; }
</style>

<h1 id="title">BirdNest</h1>
<div class="sub" id="subtitle">Looking for media…</div>

<div id="actions" hidden>
  <button data-action="copy"><span class="glyph">⧉</span>Copy to clipboard</button>
  <button data-action="save"><span class="glyph">⇩</span>Save to Downloads</button>
  <button data-action="copygif"><span class="glyph">◍</span>Copy as animated GIF</button>
  <button data-action="savegif"><span class="glyph">◎</span>Save as animated GIF</button>
</div>

<div id="status"></div>
<script src="popup.js"></script>
